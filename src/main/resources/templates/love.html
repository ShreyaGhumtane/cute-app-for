<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <title>Do you love me?</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="teddy-container">
  <img th:src="@{/images/love_you_page.gif}" alt="Love Teddy">
</div>

</form>
</body>
</html>
